name: Case Study Source Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-sources:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium


      # =====================================================
      # RUN SOURCE AUDIT
      # =====================================================

      - name: Run Case Study Source Audit
        run: python scripts/audit_sources.py
